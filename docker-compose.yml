services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-orchestration-db
    environment:
      POSTGRES_DB: ai_orchestration
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d ai_orchestration"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchestration-network

  orchestrator:
    build: .
    container_name: ai-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://orchestrator:changeme@postgres:5432/ai_orchestration
      OLLAMA_BASE_URL: https://dev.assisto.tech/ollama
      OLLAMA_MODEL: qwen3:8b
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      RESEARCH_SERVICE_URL: http://research_service:8000
      RESEARCH_SERVICE_TIMEOUT: 600
    ports:
      - "8000:8000"
    networks:
      - orchestration-network
      - rag_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  orchestration-network:
    driver: bridge
  rag_network:
    external: true
    name: rag_network